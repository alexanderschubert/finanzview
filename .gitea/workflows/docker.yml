name: Test, Build and Push FinanzView

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Docker Version
        run: docker --version

      - name: Docker Image bauen
        run: |
          docker build \
            -t finanzview-test \
            .

      - name: PHPUnit Tests
        run: |
          docker run --rm \
            --entrypoint sh \
            finanzview-test \
            -c 'touch .env && php artisan test --display-warnings'

      - name: Bei Gitea Container Registry anmelden
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
          docker login gitea.alxserver.de \
            --username "${{ secrets.REGISTRY_USER }}" \
            --password-stdin

      - name: Image für Gitea Registry taggen
        run: |
          docker tag \
            finanzview-test \
            gitea.alxserver.de/alexander/finanzview:latest

      - name: Image zu Gitea pushen
        run: |
          docker push \
            gitea.alxserver.de/alexander/finanzview:latest
