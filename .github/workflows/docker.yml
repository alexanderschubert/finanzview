name: Test, Build and Push FinanzView

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # ghcr.io verlangt Kleinbuchstaben im Image-Namen.
      - name: Image-Namen bestimmen
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker Image bauen
        run: |
          docker build \
            -t finanzview-test \
            .

      - name: PHPUnit Tests
        run: |
          docker run --rm \
            --entrypoint sh \
            finanzview-test \
            -c 'touch .env && php artisan test --display-warnings'

      # main -> :latest und :sha-xxxxxxx
      # Pull Request -> :pr-<Nummer> (Vorschau zum Testen vor dem Mergen).
      # PRs aus Forks haben keine Schreibrechte und werden nur getestet.
      - name: Bei GitHub Container Registry anmelden
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Image taggen und pushen
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAGS="latest sha-${GITHUB_SHA::7}"
          else
            TAGS="pr-${{ github.event.pull_request.number }}"
          fi

          for TAG in $TAGS; do
            docker tag finanzview-test "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
