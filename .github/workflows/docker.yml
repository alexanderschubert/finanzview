name: Test, Build and Push FinanzView

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # ghcr.io verlangt Kleinbuchstaben im Image-Namen.
      - name: Image-Namen bestimmen
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker Image bauen
        run: |
          docker build \
            -t finanzview-test \
            .

      - name: PHPUnit Tests
        run: |
          docker run --rm \
            --entrypoint sh \
            finanzview-test \
            -c 'touch .env && php artisan test --display-warnings'

      # Veröffentlicht wird nur bei einem Push auf main,
      # nicht bei Pull Requests.
      - name: Bei GitHub Container Registry anmelden
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Image taggen und pushen
        if: github.event_name == 'push'
        run: |
          docker tag finanzview-test "$IMAGE:latest"
          docker tag finanzview-test "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
