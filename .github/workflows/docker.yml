name: Test, Build and Push FinanzView

on:
  push:
    branches:
      - main
  pull_request:
  # Wöchentlich neu bauen, damit Sicherheitsupdates von PHP/Alpine ankommen.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # ghcr.io verlangt Kleinbuchstaben im Image-Namen.
      - name: Image-Namen bestimmen
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Test-Image bauen
        run: |
          docker build \
            --target test \
            -t finanzview-tests \
            .

      - name: PHPUnit Tests
        run: |
          docker run --rm \
            --entrypoint sh \
            finanzview-tests \
            -c 'touch .env && php artisan test --display-warnings'

      - name: App-Image bauen
        run: |
          docker build \
            --target app \
            -t finanzview-test \
            .

          echo "### Image-Größe" >> "$GITHUB_STEP_SUMMARY"
          docker image ls finanzview-test --format '{{.Size}}' >> "$GITHUB_STEP_SUMMARY"

      # Startet das fertige Image mit einer echten Datenbank und prüft,
      # ob Nginx, PHP-FPM, Migrationen und Anmeldeseite funktionieren.
      - name: Starttest mit PostgreSQL
        run: |
          docker network create fv-smoke

          docker run -d --name fv-db --network fv-smoke \
            -e POSTGRES_DB=finanzview \
            -e POSTGRES_USER=finanzview \
            -e POSTGRES_PASSWORD=smoke \
            postgres:17-alpine

          docker run -d --name fv-app --network fv-smoke -p 8080:80 \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_URL=http://localhost:8080 \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=fv-db \
            -e DB_PORT=5432 \
            -e DB_DATABASE=finanzview \
            -e DB_USERNAME=finanzview \
            -e DB_PASSWORD=smoke \
            finanzview-test

          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/up; then
              break
            fi
            sleep 2
          done

          curl -fsS -o /dev/null -w "/up: %{http_code}\n" http://localhost:8080/up
          curl -fsS -o /dev/null -w "/login: %{http_code}\n" http://localhost:8080/login
          curl -fsS http://localhost:8080/login | grep -q "Willkommen bei FinanzView"
          curl -fsS -o /dev/null -w "/finanzview.svg: %{http_code}\n" http://localhost:8080/finanzview.svg

          CSS=$(curl -fsS http://localhost:8080/login | grep -o '/build/assets/app-[^"]*\.css' | head -1)
          curl -fsS -o /dev/null -w "$CSS: %{http_code}\n" "http://localhost:8080$CSS"
          curl -fsSI "http://localhost:8080$CSS" | grep -qi "cache-control: public, max-age=31536000"

          # PWA
          curl -fsS http://localhost:8080/manifest.webmanifest | grep -q '"name": "FinanzView"'
          curl -fsSI http://localhost:8080/manifest.webmanifest | grep -qi "content-type: application/manifest+json"
          curl -fsSI http://localhost:8080/sw.js | grep -qi "cache-control: no-cache"
          curl -fsS -o /dev/null -w "/offline.html: %{http_code}\n" http://localhost:8080/offline.html
          curl -fsS -o /dev/null -w "/icons/icon-maskable-512.png: %{http_code}\n" http://localhost:8080/icons/icon-maskable-512.png

      # Eingebaute Datenbank (ohne DB_HOST): Start, Neustart, Sicherung und
      # Wiederherstellung mit den Skripten aus bin/.
      - name: Starttest mit eingebauter Datenbank
        run: |
          mkdir -p /tmp/fv-emb/storage /tmp/fv-emb/postgres

          docker run -d --name fv-emb -p 8082:80 \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_URL=http://localhost:8082 \
            -v /tmp/fv-emb/storage:/var/www/html/storage \
            -v /tmp/fv-emb/postgres:/var/lib/postgresql/data \
            finanzview-test

          wait_up() {
            for i in $(seq 1 90); do
              if curl -fsS -o /dev/null http://localhost:8082/up; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          wait_up
          curl -fsS http://localhost:8082/login | grep -q "Willkommen bei FinanzView"
          docker exec fv-emb test -s /var/lib/postgresql/data/pg18/PG_VERSION
          docker exec fv-emb test -s /var/www/html/storage/app/.db_password

          # artisan per docker exec findet die Datenbank über die Passwortdatei.
          docker exec fv-emb php artisan migrate:status | grep -q "Ran"

          # Sicherung
          FINANZVIEW_CONTAINER=fv-emb BACKUP_DIR=/tmp/fv-emb-backup ./bin/backup.sh
          DB_DUMP=$(ls /tmp/fv-emb-backup/finanzview-db-*.sql.gz)
          FILES_TAR=$(ls /tmp/fv-emb-backup/finanzview-files-*.tar.gz)
          test -s "$DB_DUMP"
          gunzip -c "$DB_DUMP" | grep -q "CREATE TABLE public.users"
          tar -tzf "$FILES_TAR" | grep -q ".app_key"

          # Neustart mit vorhandenen Daten
          docker restart fv-emb
          wait_up
          curl -fsS http://localhost:8082/login | grep -q "Willkommen bei FinanzView"

          # Wiederherstellung
          echo ja | FINANZVIEW_CONTAINER=fv-emb ./bin/restore.sh "$DB_DUMP" "$FILES_TAR"
          wait_up
          curl -fsS http://localhost:8082/login | grep -q "Willkommen bei FinanzView"

      - name: Container-Logs bei Fehler
        if: failure()
        run: |
          docker logs fv-app || true
          docker logs fv-db | tail -20 || true
          docker logs fv-emb | tail -80 || true

      # main -> :latest und :sha-xxxxxxx
      # Pull Request -> :pr-<Nummer> (Vorschau zum Testen vor dem Mergen).
      # PRs aus Forks haben keine Schreibrechte und werden nur getestet.
      - name: Bei GitHub Container Registry anmelden
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Image taggen und pushen
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            TAGS="latest sha-${GITHUB_SHA::7}"
          else
            TAGS="pr-${{ github.event.pull_request.number }}"
          fi

          for TAG in $TAGS; do
            docker tag finanzview-test "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
