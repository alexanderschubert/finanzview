name: Funktion vorschlagen
description: Eine neue Funktion oder Verbesserung
title: "Funktion: "
labels: ["Funktion"]
body:
  - type: textarea
    id: idee
    attributes:
      label: Was soll FinanzView können?
    validations:
      required: true
  - type: textarea
    id: nutzen
    attributes:
      label: Wozu brauchst du das?
      description: Beschreibe die Situation, in der dir die Funktion fehlt.
  - type: textarea
    id: vorschlag
    attributes:
      label: Wie könnte es aussehen?
      description: Skizzen, Screenshots oder Beispiele helfen.
