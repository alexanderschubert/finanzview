services:

  app:
    image: gitea.alxserver.de/alexander/finanzblick:latest
    container_name: finanzview-app
    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "80"

    volumes:
      - ./storage:/var/www/html/storage

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - finanzblick


  postgres:
    image: postgres:17-alpine
    container_name: finanzblick-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-finanzblick}
      POSTGRES_USER: ${DB_USERNAME:-finanzblick}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finanzblick_dev}

    volumes:
      - finanzblick_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-finanzblick} -d ${DB_DATABASE:-finanzblick}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - finanzblick


volumes:

  finanzblick_postgres:
    name: finanzblick_postgres


networks:

  finanzblick:
    name: finanzblick-net
    external: true
