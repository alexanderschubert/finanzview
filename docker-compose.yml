services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finanzblick-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - finanzblick_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks: [finanzblick]

  nginx:
    image: nginx:1.27-alpine
    container_name: finanzblick-nginx
    restart: unless-stopped
    ports:
      - "8099:80"
    volumes:
      - ./:/var/www/html:ro
      - finanzblick_vendor:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [finanzblick]

  postgres:
    image: postgres:17-alpine
    container_name: finanzblick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finanzblick
      POSTGRES_USER: finanzblick
      POSTGRES_PASSWORD: finanzblick_dev
    ports:
      - "54329:5432"
    volumes:
      - finanzblick_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzblick -d finanzblick"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [finanzblick]

  node:
    image: node:22-bookworm
    container_name: finanzblick-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run build"
    networks:
      - finanzblick
volumes:
  finanzblick_postgres:
    name: finanzblick_postgres
  finanzblick_vendor:
    name: finanzblick_vendor

networks:
  finanzblick:
    name: finanzblick