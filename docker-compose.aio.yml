# FinanzView All-in-One: ein Container mit App und PostgreSQL.
# Alle Daten liegen im Ordner ./data (Datenbank, Storage, tägliche Sicherungen).
#
# Starten:  docker compose -f docker-compose.aio.yml up -d
services:

  finanzview:
    image: ghcr.io/alexanderschubert/finanzview-aio:latest
    container_name: finanzview
    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      # Öffentliche Adresse, z. B. https://finanzview.example.com
      APP_URL: ${APP_URL:-http://localhost:8080}
      TZ: ${TZ:-Europe/Berlin}

      # Optional: fester Schlüssel (base64:...). Leer = wird beim ersten Start erzeugt und in ./data/storage gespeichert.
      APP_KEY: ${APP_KEY:-}

      # Optional: Anmeldung über OpenID Connect (z. B. Authentik)
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}

      # Optional: FinTS-Produktregistrierung für den Bankabruf
      FINTS_PRODUCT_ID: ${FINTS_PRODUCT_ID:-}

    volumes:
      - ./data:/data
